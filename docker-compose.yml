services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizapp
      POSTGRES_USER: quizapp
      POSTGRES_PASSWORD: quizapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      - node_modules:/var/www/html/node_modules
      - storage:/var/www/html/storage
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - public_build:/var/www/html/public/build
      - public_build:/shared-public-build
    environment:
      APP_URL: http://localhost:${APP_HTTP_PORT:-8080}
      GOOGLE_REDIRECT_URI: http://localhost:${APP_HTTP_PORT:-8080}/auth/google/callback
    depends_on:
      db:
        condition: service_healthy

  webserver:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - storage:/var/www/html/storage:ro
      - public_build:/var/www/html/public/build:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

volumes:
  pgdata:
  vendor:
  node_modules:
  storage:
  bootstrap_cache:
  public_build:
